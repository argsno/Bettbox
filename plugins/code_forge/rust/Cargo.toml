[package]
name = "code_forge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
fancy-regex = { version = "0.14", default-features = false, features = ["std"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid", "perf-literal", "unicode-case", "unicode-perl", "unicode-word-boundary"] }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
rquickjs = { version = "0.14", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["bindgen"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Proc-macro dylibs must not be stripped: with chained fixups (deployment
# target >= 11) a stripped LINKEDIT string pool can be 8-byte misaligned and
# dyld refuses to load the dylib (rustc: E0463 "can't find crate").
[profile.release.package.futures-macro]
strip = false

[profile.release.package.delegate-attr]
strip = false

[profile.release.package.flutter_rust_bridge_macros]
strip = false

[profile.release.package.rquickjs-macro]
strip = false

[profile.release.package.rustversion]
strip = false

[profile.release.package.serde_derive]
strip = false

[profile.release.package.wasm-bindgen-macro]
strip = false
